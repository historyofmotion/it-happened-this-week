<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221f1d" />
      <stop offset="100%" stop-color="#141211" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0714a" />
      <stop offset="100%" stop-color="#b4491f" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring / Accent border -->
  <rect x="32" y="32" width="448" height="448" rx="88" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.3" />

  <g filter="url(#shadow)">
    <!-- Calendar / Notebook Base -->
    <rect x="112" y="128" width="288" height="288" rx="24" fill="#2a2624" stroke="#34302c" stroke-width="4" />

    <!-- Top Accent Bar -->
    <path d="M112 152 C112 138.745 122.745 128 136 128 L376 128 C389.255 128 400 138.745 400 152 L400 192 L112 192 Z" fill="url(#accentGrad)" />

    <!-- Binder Rings -->
    <rect x="160" y="104" width="24" height="48" rx="12" fill="#e6e2dc" />
    <rect x="244" y="104" width="24" height="48" rx="12" fill="#e6e2dc" />
    <rect x="328" y="104" width="24" height="48" rx="12" fill="#e6e2dc" />

    <!-- Note lines -->
    <rect x="152" y="232" width="136" height="20" rx="10" fill="#e0714a" opacity="0.9" />
    <rect x="304" y="232" width="56" height="20" rx="10" fill="#6d675f" opacity="0.5" />

    <rect x="152" y="280" width="208" height="20" rx="10" fill="#a09a92" opacity="0.7" />
    <rect x="152" y="328" width="160" height="20" rx="10" fill="#a09a92" opacity="0.7" />

    <!-- Checkmark Badge -->
    <circle cx="344" cy="336" r="38" fill="url(#accentGrad)" />
    <path d="M326 336 L338 348 L364 322" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
